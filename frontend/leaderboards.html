<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Leaderboards · PlaySphere</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { brand: { 400: '#a78bfa', 500: '#7c3aed', 600: '#6d28d9', 700: '#5b21b6' } },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
    } },
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  .rank-1 { background: linear-gradient(90deg, rgba(251,191,36,0.15), transparent); border-color: rgba(251,191,36,0.4); }
  .rank-2 { background: linear-gradient(90deg, rgba(148,163,184,0.12), transparent); border-color: rgba(148,163,184,0.35); }
  .rank-3 { background: linear-gradient(90deg, rgba(217,119,6,0.12), transparent); border-color: rgba(217,119,6,0.35); }
  .me-row { background: linear-gradient(90deg, rgba(124,58,237,0.18), transparent); border-color: rgba(124,58,237,0.5); }
</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">

  <header class="border-b border-slate-900 sticky top-0 z-40 bg-slate-950/95 backdrop-blur">
    <div class="mx-auto max-w-5xl px-3 sm:px-6 py-3 flex items-center justify-between">
      <a href="/dashboard" class="flex items-center gap-2">
        <div class="h-8 w-8 rounded-lg bg-brand-600 grid place-items-center font-extrabold">P</div>
        <span class="font-bold hidden sm:inline">PlaySphere</span>
      </a>
      <a href="/dashboard" class="text-sm text-slate-400 hover:text-slate-100">← Back</a>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-3 sm:px-6 py-5 sm:py-10">
    <div class="text-center">
      <div class="text-4xl mb-2">🏆</div>
      <h1 class="text-2xl sm:text-3xl font-black">Leaderboards</h1>
      <p class="text-slate-400 mt-1 text-xs sm:text-sm">Rankings update in real time</p>
    </div>

    <!-- Scope tabs -->
    <div class="flex justify-center gap-2 mt-5 sm:mt-6">
      <button data-scope="global" class="scope-btn px-4 py-2 text-sm font-bold rounded-lg bg-brand-600">🌍 Global</button>
      <button data-scope="friends" class="scope-btn px-4 py-2 text-sm font-bold rounded-lg bg-slate-800 text-slate-400 hover:text-slate-200">👥 Friends</button>
    </div>

    <!-- Category tabs -->
    <div class="flex justify-center gap-2 mt-3 flex-wrap">
      <button data-cat="xp" class="cat-btn px-3 sm:px-4 py-2 text-xs sm:text-sm font-bold rounded-lg border border-brand-500 bg-brand-500/20 text-brand-400">⭐ XP</button>
      <button data-cat="tokens" class="cat-btn px-3 sm:px-4 py-2 text-xs sm:text-sm font-bold rounded-lg border border-slate-700 text-slate-400 hover:text-slate-200">🪙 PlayCoins</button>
      <button data-cat="wins" class="cat-btn px-3 sm:px-4 py-2 text-xs sm:text-sm font-bold rounded-lg border border-slate-700 text-slate-400 hover:text-slate-200">⚔️ Wins</button>
      <button data-cat="win_rate" class="cat-btn px-3 sm:px-4 py-2 text-xs sm:text-sm font-bold rounded-lg border border-slate-700 text-slate-400 hover:text-slate-200">📊 Win Rate</button>
    </div>

    <!-- My rank card -->
    <div id="myRankCard" class="mt-6 rounded-2xl border border-brand-500/40 bg-gradient-to-br from-brand-600/15 to-slate-900/60 p-4 sm:p-5">
      <div class="flex items-center justify-between">
        <div>
          <div class="text-[10px] sm:text-xs uppercase tracking-widest text-brand-400 font-bold">Your Rank</div>
          <div id="myRankLine" class="text-xl sm:text-2xl font-black mt-1">–</div>
        </div>
        <div class="text-right">
          <div class="text-[10px] sm:text-xs uppercase tracking-widest text-slate-500">Value</div>
          <div id="myValue" class="text-lg sm:text-xl font-bold text-brand-400 mt-1">–</div>
        </div>
      </div>
      <div id="myRankSub" class="text-xs text-slate-500 mt-2">–</div>
    </div>

    <div id="msg" class="hidden mt-4 rounded-lg p-3 text-sm text-center border"></div>

    <!-- Entries -->
    <div id="entriesList" class="mt-5 space-y-2">
      <div class="text-center text-slate-500 text-sm py-8">Loading…</div>
    </div>
  </main>

  <script type="module" src="/static/js/leaderboards.js"></script>
</body>
</html>
