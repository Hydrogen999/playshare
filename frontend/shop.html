<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Shop · PlaySphere</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { brand: { 400: '#a78bfa', 500: '#7c3aed', 600: '#6d28d9', 700: '#5b21b6' } },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
    } },
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  .frame-preview {
    position: relative;
    width: 72px; height: 72px;
    border-radius: 50%;
    padding: 4px;
  }
  .frame-preview-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: #64748b;
    display: grid; place-items: center;
    font-size: 32px;
  }
</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">

  <header class="border-b border-slate-900 sticky top-0 z-40 bg-slate-950/95 backdrop-blur">
    <div class="mx-auto max-w-6xl px-3 sm:px-6 py-3 flex items-center justify-between">
      <a href="/dashboard" class="flex items-center gap-2">
        <div class="h-8 w-8 rounded-lg bg-brand-600 grid place-items-center font-extrabold">P</div>
        <span class="font-bold hidden sm:inline">PlaySphere</span>
      </a>
      <div class="flex items-center gap-3">
        <div class="text-sm">
          <span class="text-slate-500">Balance:</span>
          <span id="balance" class="font-bold text-brand-400">–</span>
          <span class="text-slate-500 text-xs">PC</span>
        </div>
        <a href="/dashboard" class="text-sm text-slate-400 hover:text-slate-100">← Back</a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-3 sm:px-6 py-5 sm:py-10">
    <h1 class="text-2xl sm:text-3xl font-extrabold">🛍️ Shop</h1>
    <p class="text-slate-400 mt-1 text-xs sm:text-sm">Spend your PlayCoins on cosmetic items. Owned items stay forever.</p>

    <!-- Tabs -->
    <div class="flex gap-2 mt-5 sm:mt-6 border-b border-slate-800">
      <button data-tab="shop" class="tab-btn px-4 py-2.5 text-sm font-bold text-brand-400 border-b-2 border-brand-500">Shop</button>
      <button data-tab="inventory" class="tab-btn px-4 py-2.5 text-sm font-bold text-slate-400 hover:text-slate-200">My Items</button>
    </div>

    <!-- Status message -->
    <div id="msg" class="hidden mt-4 rounded-lg p-3 text-sm text-center"></div>

    <!-- Items grid -->
    <div id="itemsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4 mt-5 sm:mt-6">
      <div class="col-span-full text-center text-slate-500 text-sm py-8">Loading…</div>
    </div>
  </main>

  <script type="module" src="/static/js/shop.js"></script>
</body>
</html>
