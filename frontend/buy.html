<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Buy PlayCoins · PlaySphere</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { brand: { 400: '#a78bfa', 500: '#7c3aed', 600: '#6d28d9', 700: '#5b21b6' } },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
    } },
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">

  <header class="border-b border-slate-900 sticky top-0 z-40 bg-slate-950/95 backdrop-blur">
    <div class="mx-auto max-w-5xl px-3 sm:px-6 py-3 flex items-center justify-between">
      <a href="/dashboard" class="flex items-center gap-2">
        <div class="h-8 w-8 rounded-lg bg-brand-600 grid place-items-center font-extrabold">P</div>
        <span class="font-bold hidden sm:inline">PlaySphere</span>
      </a>
      <div class="flex items-center gap-3 text-sm">
        <div class="text-slate-500 hidden sm:inline">Balance:</div>
        <span id="balance" class="font-bold text-brand-400">–</span>
        <span class="text-slate-500 text-xs">PC</span>
        <a href="/dashboard" class="text-slate-400 hover:text-slate-100 ml-2">← Back</a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-3 sm:px-6 py-6 sm:py-10">
    <div class="text-center max-w-2xl mx-auto">
      <h1 class="text-3xl sm:text-4xl font-extrabold">🪙 Buy PlayCoins</h1>
      <p class="text-slate-400 mt-3 text-sm sm:text-base">
        Instant delivery. Pay with card, transfer, or USSD.
      </p>
    </div>

    <!-- Currency toggle -->
    <div class="flex justify-center gap-2 mt-6">
      <button id="tabNgn" class="px-5 py-2.5 rounded-lg font-bold text-sm bg-brand-600">
        🇳🇬 Naira (Paystack)
      </button>
      <button id="tabUsd" class="px-5 py-2.5 rounded-lg font-bold text-sm bg-slate-800 text-slate-400 hover:text-slate-200">
        🌍 Global USD (Flutterwave)
      </button>
    </div>

    <div id="msg" class="hidden mt-6 rounded-lg p-3 text-sm text-center border"></div>

    <div id="packsGrid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mt-8">
      <div class="col-span-full text-center text-slate-500 text-sm py-8">Loading…</div>
    </div>

    <div class="mt-10 text-xs text-slate-500 text-center max-w-xl mx-auto">
      <p>Payments processed securely by <span class="text-slate-300 font-semibold">Paystack</span> and <span class="text-slate-300 font-semibold">Flutterwave</span>.</p>
      <p class="mt-2">PlayCoins are non-refundable in-game currency. They cannot be exchanged for real money.</p>
    </div>
  </main>

  <script type="module" src="/static/js/buy.js"></script>
</body>
</html>
