<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Profile · PlaySphere</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { brand: { 400: '#a78bfa', 500: '#7c3aed', 600: '#6d28d9', 700: '#5b21b6' } },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
    } },
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">

  <header class="border-b border-slate-900 sticky top-0 z-40 bg-slate-950/95 backdrop-blur">
    <div class="mx-auto max-w-3xl px-4 sm:px-6 py-3 flex items-center justify-between">
      <a href="/dashboard" class="flex items-center gap-2">
        <div class="h-8 w-8 rounded-lg bg-brand-600 grid place-items-center font-extrabold">P</div>
        <span class="font-bold hidden sm:inline">PlaySphere</span>
      </a>
      <a href="/dashboard" class="text-sm text-slate-400 hover:text-slate-100">← Back</a>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-4 sm:px-6 py-6 sm:py-10">
    <div id="loading" class="text-center text-slate-500 py-20">Loading profile…</div>
    
    <div id="content" class="hidden">
      <!-- Header -->
      <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 bg-slate-900/60 border border-slate-800 p-6 rounded-2xl">
        <div id="avatarSlot"></div>
        <div class="flex-1 text-center sm:text-left">
          <h1 id="username" class="text-3xl font-black">…</h1>
          <div class="mt-2 flex flex-wrap justify-center sm:justify-start items-center gap-2">
            <span id="levelBadge" class="text-xs font-bold px-2 py-1 rounded bg-brand-500/20 text-brand-400 border border-brand-500/40">LV 1</span>
            <span id="tierBadge" class="text-xs font-bold px-2 py-1 rounded border">–</span>
            <span id="countryFlag" class="text-xs text-slate-400">🌍</span>
          </div>
          <p id="bio" class="mt-4 text-sm text-slate-300 italic">"…"</p>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex gap-2 mt-4">
        <button id="msgBtn" class="flex-1 rounded-lg bg-brand-600 hover:bg-brand-700 px-4 py-3 text-sm font-bold transition">💬 Message</button>
        <button id="addFriendBtn" class="flex-1 rounded-lg border border-slate-700 hover:bg-slate-800 px-4 py-3 text-sm font-bold transition">+ Add Friend</button>
      </div>

      <!-- Stats Grid -->
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-6">
        <div class="rounded-xl border border-slate-800 bg-slate-900/50 p-4">
          <div class="text-xs text-slate-500 uppercase tracking-widest">Chess Rating</div>
          <div id="eloRating" class="text-2xl font-bold text-brand-400 mt-1">–</div>
        </div>
        <div class="rounded-xl border border-slate-800 bg-slate-900/50 p-4">
          <div class="text-xs text-slate-500 uppercase tracking-widest">Achievements</div>
          <div id="achCount" class="text-2xl font-bold text-emerald-400 mt-1">–</div>
        </div>
        <div class="rounded-xl border border-slate-800 bg-slate-900/50 p-4">
          <div class="text-xs text-slate-500 uppercase tracking-widest">PlayCoins</div>
          <div id="coins" class="text-2xl font-bold text-amber-400 mt-1">–</div>
        </div>
      </div>

      <!-- Recent Matches -->
      <div class="mt-6 rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
        <div class="text-xs uppercase tracking-widest text-slate-500 mb-4">Recent Matches</div>
        <div id="matchList" class="space-y-2">
          <div class="text-sm text-slate-500">No recent matches.</div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { api } from "/static/js/api.js";
    import { avatarHTML } from "/static/js/avatars.js";

    const $ = (id) => document.getElementById(id);

    const TIER_META = {
      bronze: { icon: "🥉", label: "Bronze", color: "#cd7f32" },
      silver: { icon: "🥈", label: "Silver", color: "#c0c0c0" },
      gold: { icon: "🥇", label: "Gold", color: "#facc15" },
      diamond: { icon: "💎", label: "Diamond", color: "#60a5fa" },
      grandmaster: { icon: "👑", label: "Grandmaster", color: "#a855f7" },
    };

    function gameIcon(slug) {
      if (slug === "ludo") return "🎯";
      if (slug === "chess") return "♟️";
      return "🎲";
    }

    async function loadProfile() {
      const params = new URLSearchParams(location.search);
      const userId = params.get("id");
      
      if (!userId) {
        $("loading").innerHTML = "<span class='text-red-400'>No user ID provided.</span>";
        return;
      }

      try {
        const me = await api.me();
        const profile = await api.request(`/api/v1/users/${userId}`);
        
        // Render avatar & header
        $("avatarSlot").innerHTML = avatarHTML(profile.avatar_id, "xl", profile.frame_color, profile.elo >= 2200);
        $("username").textContent = profile.username;
        $("levelBadge").textContent = `LV ${profile.level}`;
        
        const tMeta = TIER_META[profile.chess_tier] || TIER_META.bronze;
        $("tierBadge").textContent = `${tMeta.icon} ${tMeta.label}`;
        $("tierBadge").style.color = tMeta.color;
        $("tierBadge").style.borderColor = `${tMeta.color}50`;
        $("tierBadge").style.background = `${tMeta.color}15`;

        if (profile.country) {
          $("countryFlag").textContent = `🌍 ${profile.country}`;
        }
        if (profile.bio) {
          $("bio").textContent = `"${profile.bio}"`;
        } else {
          $("bio").textContent = "No bio yet.";
        }

        // Render Stats
        $("eloRating").textContent = profile.elo;
        $("achCount").textContent = profile.stats.achievements_unlocked;
        $("coins").textContent = profile.stats.coins.toLocaleString();

        // Render Matches
        const mList = $("matchList");
        if (profile.recent_matches.length === 0) {
          mList.innerHTML = `<div class="text-sm text-slate-500 text-center">No matches played yet.</div>`;
        } else {
          mList.innerHTML = profile.recent_matches.map(m => {
            const color = m.result === "win" ? "text-emerald-400" : m.result === "loss" ? "text-red-400" : "text-slate-400";
            const label = m.result === "win" ? "WIN" : m.result === "loss" ? "LOSS" : "DRAW";
            return `
              <div class="flex items-center justify-between rounded-lg bg-slate-800/40 px-3 py-2 border border-slate-800">
                <div class="flex items-center gap-2">
                  <div class="text-lg">${gameIcon(m.game_slug)}</div>
                  <div class="text-sm">vs <span class="font-bold">${m.opponent_username}</span></div>
                </div>
                <div class="text-xs font-bold ${color}">${label}</div>
              </div>
            `;
          }).join("");
        }

        // Actions
        if (profile.relationship === "self") {
          $("msgBtn").style.display = "none";
          $("addFriendBtn").style.display = "none";
        } else if (profile.relationship === "friends") {
          $("addFriendBtn").textContent = "✓ Friends";
          $("addFriendBtn").className = "flex-1 rounded-lg border border-emerald-500/50 bg-emerald-500/10 text-emerald-400 px-4 py-3 text-sm font-bold cursor-default";
          $("addFriendBtn").disabled = true;
        }

        $("msgBtn").onclick = () => { window.location.href = `/friends?chat=${profile.id}`; };
        $("addFriendBtn").onclick = async () => {
          try {
            await api.sendFriendRequest(profile.id);
            $("addFriendBtn").textContent = "Request Sent";
            $("addFriendBtn").disabled = true;
            $("addFriendBtn").className = "flex-1 rounded-lg border border-slate-700 bg-slate-800 text-slate-400 px-4 py-3 text-sm font-bold";
          } catch(err) { alert(err.message); }
        };

        $("loading").classList.add("hidden");
        $("content").classList.remove("hidden");

      } catch (err) {
        $("loading").innerHTML = `<span class="text-red-400">${err.message}</span>`;
      }
    }

    loadProfile();
  </script>
</body>
</html>
