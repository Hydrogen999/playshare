<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Achievements · PlaySphere</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { brand: { 400: '#a78bfa', 500: '#7c3aed', 600: '#6d28d9', 700: '#5b21b6' } },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
    } },
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  .locked { opacity: 0.45; filter: grayscale(0.7); }
  .tier-bronze    { border-color: #ea580c; }
  .tier-silver    { border-color: #94a3b8; }
  .tier-gold      { border-color: #facc15; box-shadow: 0 0 20px rgba(250,204,21,0.15); }
  .tier-legendary { border-color: #a855f7; box-shadow: 0 0 20px rgba(168,85,247,0.25); }
</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">

  <header class="border-b border-slate-900 sticky top-0 z-40 bg-slate-950/95 backdrop-blur">
    <div class="mx-auto max-w-5xl px-3 sm:px-6 py-3 flex items-center justify-between">
      <a href="/dashboard" class="flex items-center gap-2">
        <div class="h-8 w-8 rounded-lg bg-brand-600 grid place-items-center font-extrabold">P</div>
        <span class="font-bold hidden sm:inline">PlaySphere</span>
      </a>
      <a href="/dashboard" class="text-sm text-slate-400 hover:text-slate-100">← Back</a>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-3 sm:px-6 py-5 sm:py-10">
    <div class="text-center">
      <div class="text-4xl mb-2">🏅</div>
      <h1 class="text-2xl sm:text-3xl font-black">Achievements</h1>
      <p class="text-slate-400 mt-1 text-xs sm:text-sm">Unlock badges as you play</p>
    </div>

    <!-- Progress summary -->
    <div class="mt-5 rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
      <div class="flex items-center justify-between mb-2">
        <div class="text-xs uppercase tracking-widest text-slate-500">Progress</div>
        <div class="text-sm font-bold"><span id="unlockedCount" class="text-brand-400">0</span> / <span id="totalCount" class="text-slate-400">0</span></div>
      </div>
      <div class="h-3 rounded-full bg-slate-800 overflow-hidden">
        <div id="progressBar" class="h-full rounded-full bg-gradient-to-r from-brand-500 to-fuchsia-500 transition-all" style="width: 0%"></div>
      </div>
    </div>

    <!-- Filter tabs -->
    <div class="flex justify-center gap-2 mt-5 flex-wrap">
      <button data-filter="all" class="filter-btn px-3 py-2 text-xs font-bold rounded-lg bg-brand-600">All</button>
      <button data-filter="unlocked" class="filter-btn px-3 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 hover:text-slate-200">Unlocked</button>
      <button data-filter="locked" class="filter-btn px-3 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 hover:text-slate-200">Locked</button>
    </div>

    <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 mt-5">
      <div class="col-span-full text-center text-slate-500 text-sm py-8">Loading…</div>
    </div>
  </main>

  <script type="module" src="/static/js/achievements.js"></script>
</body>
</html>
