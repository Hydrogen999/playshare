<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Friends · PlaySphere</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { brand: { 400: '#a78bfa', 500: '#7c3aed', 600: '#6d28d9', 700: '#5b21b6' }, cyber: { cyan: '#06b6d4', pink: '#ec4899' } },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Orbitron', 'sans-serif'] },
    } },
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* Custom Scrollbar for chat */
  .chat-scroll::-webkit-scrollbar { width: 4px; }
  .chat-scroll::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 3px; }

  /* Cyberpunk Background Grid */
  .cyber-bg {
    background-color: #02000a;
    background-image: 
      linear-gradient(rgba(124, 58, 237, 0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124, 58, 237, 0.1) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Glassmorphism Panels */
  .glass-panel {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(124, 58, 237, 0.2);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
  }

  /* Animated Glow for Call Buttons */
  .pulse-glow:hover {
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
    border-color: #06b6d4;
  }

  /* Chat Message Animations */
  .chat-bubble {
    animation: slideUp 0.2s ease-out forwards;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Mobile layout: hide chat panel until a chat is opened */
  @media (max-width: 767px) {
    body.chat-open #listPanel { display: none; }
    body:not(.chat-open) #chatPanel { display: none; }
    #chatPanel { position: fixed; inset: 0; z-index: 40; border-radius: 0; }
  }

  /* Desktop: both visible side-by-side */
  @media (min-width: 768px) {
    #chatPanel { position: relative; }
    #mobileBack { display: none; }
  }

  /* Video Call Overlay */
  .video-overlay {
    position: fixed; inset: 0; z-index: 90; background: #000;
    display: none; flex-direction: column;
  }
  .video-overlay.active { display: flex; }
  .incoming-call-modal { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100; }
</style>
</head>
<body class="min-h-screen cyber-bg text-slate-100 font-sans antialiased">

  <header class="border-b border-brand-500/20 sticky top-0 z-30 bg-slate-950/80 backdrop-blur-md">
    <div class="mx-auto max-w-6xl px-4 sm:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <a href="/dashboard" class="flex items-center gap-2">
          <div class="h-8 w-8 rounded-lg bg-gradient-to-br from-brand-500 to-cyber-pink grid place-items-center font-extrabold shadow-lg shadow-brand-500/30">P</div>
          <span class="font-bold font-display tracking-wide hidden sm:inline">PlaySphere</span>
        </a>
        <span class="text-xs text-brand-400 font-bold ml-2">· COMMS</span>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <a href="/lobby" class="text-slate-400 hover:text-cyber-cyan transition">Lobby</a>
        <a href="/dashboard" class="text-slate-400 hover:text-cyber-cyan transition">Home</a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-0 sm:px-4 py-0 sm:py-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-0 sm:gap-4 h-[calc(100vh-3.5rem)] sm:h-[80vh]">

      <!-- LEFT: List panel -->
      <div id="listPanel" class="md:col-span-1 sm:rounded-2xl glass-panel flex flex-col overflow-hidden">
        <div class="p-4 border-b border-brand-500/20">
          <input id="searchInput" type="text" placeholder="Search the network…"
            class="w-full rounded-xl bg-slate-900/50 border border-brand-500/30 px-4 py-3 text-sm focus:outline-none focus:border-cyber-cyan transition placeholder-slate-600" />
        </div>

        <div class="flex border-b border-brand-500/20 text-xs font-bold tracking-wider uppercase">
          <button data-tab="friends" class="tab-btn flex-1 py-4 text-cyber-cyan border-b-2 border-cyber-cyan bg-cyber-cyan/5 transition">Friends</button>
          <button data-tab="requests" class="tab-btn flex-1 py-4 text-slate-500 hover:text-slate-300 transition">
            Requests <span id="reqBadge" class="ml-1 px-2 py-0.5 rounded-full bg-cyber-pink text-white text-[10px] hidden shadow-[0_0_10px_#ec4899]">0</span>
          </button>
          <button data-tab="chats" class="tab-btn flex-1 py-4 text-slate-500 hover:text-slate-300 transition">Chats</button>
        </div>

        <div id="listArea" class="flex-1 overflow-y-auto chat-scroll"></div>
      </div>

      <!-- RIGHT: Chat panel -->
      <div id="chatPanel" class="md:col-span-2 sm:rounded-2xl glass-panel flex flex-col overflow-hidden relative">
        
        <!-- Chat Header -->
        <div id="chatHeader" class="px-4 py-3 border-b border-brand-500/20 flex items-center gap-3 bg-slate-900/40 backdrop-blur-md z-10">
          <button id="mobileBack" class="md:hidden text-slate-400 hover:text-white p-1 -ml-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
          </button>
          <div id="chatHeaderContent" class="text-sm text-slate-400 font-medium">Select a conversation to begin transmission</div>
        </div>

        <!-- Messages Area -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 chat-scroll space-y-3 relative z-0"></div>

        <!-- Input Form -->
        <form id="chatForm" class="border-t border-brand-500/20 p-3 flex gap-2 bg-slate-950/80 backdrop-blur-lg hidden z-10 items-center">
          
          <!-- Image Upload Button (Premium) -->
          <label class="cursor-pointer flex-shrink-0 p-2.5 rounded-full bg-slate-800/80 hover:bg-slate-700 border border-slate-600 transition group relative" title="Send Image">
            <span class="text-xl text-slate-400 group-hover:text-cyber-cyan transition">📷</span>
            <input type="file" id="chatImageInput" accept="image/*" class="hidden" />
          </label>

          <!-- Voice Note Button -->
          <button type="button" id="voiceNoteBtn" class="flex-shrink-0 p-2.5 rounded-full bg-slate-800/80 hover:bg-slate-700 border border-slate-600 transition group relative" title="Record Voice Note">
            <span class="text-xl text-slate-400 group-hover:text-cyber-pink transition" id="micIcon">🎤</span>
          </button>

          <!-- Text Input -->
          <input id="chatInput" type="text" maxlength="1000" placeholder="Type a message…"
            class="flex-1 rounded-full bg-slate-900/80 border border-brand-500/30 px-5 py-3 text-sm focus:outline-none focus:border-cyber-cyan focus:shadow-[0_0_15px_rgba(6,182,212,0.3)] transition text-white" />
          
          <!-- Send Button -->
          <button type="submit" class="flex-shrink-0 p-3 rounded-full bg-gradient-to-r from-brand-600 to-cyber-pink hover:from-brand-500 hover:to-cyber-pink/80 text-white shadow-lg shadow-brand-500/30 transition transform hover:scale-105">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" /></svg>
          </button>
        </form>
      </div>

    </div>
  </main>

  <script type="module" src="/static/js/friends.js"></script>
</body>
</html>
