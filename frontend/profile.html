<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Edit profile · PlaySphere</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { brand: { 500: '#7c3aed', 600: '#6d28d9', 700: '#5b21b6' } },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
    } },
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">

  <header class="border-b border-slate-900 sticky top-0 z-40 bg-slate-950/95 backdrop-blur">
    <div class="mx-auto max-w-3xl px-3 sm:px-6 py-3 flex items-center justify-between">
      <a href="/dashboard" class="flex items-center gap-2">
        <div class="h-8 w-8 rounded-lg bg-brand-600 grid place-items-center font-extrabold">P</div>
        <span class="font-bold hidden sm:inline">PlaySphere</span>
      </a>
      <a href="/dashboard" class="text-sm text-slate-400 hover:text-slate-100">← Back</a>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-3 sm:px-6 py-6 sm:py-10">
    <h1 class="text-xl sm:text-2xl font-bold">Edit profile</h1>
    <p class="text-slate-400 mt-1 text-xs sm:text-sm">Changes save instantly.</p>

    <section class="rounded-2xl border border-slate-800 bg-slate-900/60 p-4 sm:p-6 mt-5 sm:mt-8">
      <div class="flex items-center gap-4 sm:gap-5">
        <div id="avatarPreview"></div>
        <div>
          <div class="text-xs sm:text-sm text-slate-400">Your current avatar</div>
          <div id="username" class="text-base sm:text-lg font-bold">…</div>
        </div>
      </div>

      <form id="profileForm" class="mt-6 sm:mt-8 space-y-4 sm:space-y-5">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Bio (max 280 chars)</label>
          <textarea name="bio" rows="3" maxlength="280"
            class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500"
            placeholder="Say something cool..."></textarea>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Country</label>
          <select name="country"
            class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500">
            <option value="">— None —</option>
            <option value="NG">Nigeria 🇳🇬</option>
            <option value="US">United States 🇺🇸</option>
            <option value="GB">United Kingdom 🇬🇧</option>
            <option value="CA">Canada 🇨🇦</option>
            <option value="IN">India 🇮🇳</option>
            <option value="BR">Brazil 🇧🇷</option>
            <option value="DE">Germany 🇩🇪</option>
            <option value="FR">France 🇫🇷</option>
            <option value="ZA">South Africa 🇿🇦</option>
            <option value="GH">Ghana 🇬🇭</option>
            <option value="KE">Kenya 🇰🇪</option>
            <option value="EG">Egypt 🇪🇬</option>
            <option value="JP">Japan 🇯🇵</option>
            <option value="AU">Australia 🇦🇺</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-2">Choose your avatar</label>
          <div id="avatarGrid" class="grid grid-cols-4 sm:grid-cols-6 gap-2 sm:gap-3"></div>
        </div>

        <button type="submit"
          class="w-full sm:w-auto rounded-lg bg-brand-600 hover:bg-brand-700 transition px-5 py-2.5 text-sm font-semibold">
          Save changes
        </button>
        <p id="msg" class="text-sm hidden"></p>
      </form>
    </section>
  </main>

  <script type="module" src="/static/js/profile.js"></script>
</body>
</html>
