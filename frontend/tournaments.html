<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tournaments · PlaySphere</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { brand: { 400: '#a78bfa', 500: '#7c3aed', 600: '#6d28d9', 700: '#5b21b6' } },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
    } },
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">

  <header class="border-b border-slate-900 sticky top-0 z-40 bg-slate-950/95 backdrop-blur">
    <div class="mx-auto max-w-6xl px-3 sm:px-6 py-3 flex items-center justify-between">
      <a href="/dashboard" class="flex items-center gap-2">
        <div class="h-8 w-8 rounded-lg bg-brand-600 grid place-items-center font-extrabold">P</div>
        <span class="font-bold hidden sm:inline">PlaySphere</span>
      </a>
      <div class="flex items-center gap-2 sm:gap-3 text-sm">
        <div class="text-slate-500 hidden sm:inline">Balance:</div>
        <span id="balance" class="font-bold text-brand-400">–</span>
        <span class="text-slate-500 text-xs">PC</span>
        <a href="/dashboard" class="text-slate-400 hover:text-slate-100 ml-2">← Back</a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-3 sm:px-6 py-5 sm:py-10">
    <div class="flex items-start justify-between flex-wrap gap-3">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold">🏆 Tournaments</h1>
        <p class="text-slate-400 mt-1 text-xs sm:text-sm">Ludo brackets · Winner takes the pot</p>
      </div>
      <button id="createBtn" class="rounded-lg bg-brand-600 hover:bg-brand-700 px-4 py-2.5 text-sm font-bold transition">
        + Create Tournament
      </button>
    </div>

    <!-- Tabs -->
    <div class="flex gap-2 mt-5 sm:mt-6 border-b border-slate-800">
      <button data-tab="open" class="tab-btn px-4 py-2.5 text-sm font-bold text-brand-400 border-b-2 border-brand-500">Open</button>
      <button data-tab="mine" class="tab-btn px-4 py-2.5 text-sm font-bold text-slate-400 hover:text-slate-200">My Tournaments</button>
    </div>

    <div id="msg" class="hidden mt-4 rounded-lg p-3 text-sm text-center border"></div>

    <div id="listArea" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4 mt-5 sm:mt-6">
      <div class="col-span-full text-center text-slate-500 text-sm py-8">Loading…</div>
    </div>

    <!-- Detail view (hidden until a tournament is opened) -->
    <div id="detailModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm items-center justify-center p-4 overflow-y-auto">
      <div class="w-full max-w-3xl rounded-2xl border border-slate-800 bg-slate-900 p-5 sm:p-6 shadow-2xl my-8">
        <div id="detailBody"></div>
        <button id="detailClose" class="mt-4 w-full rounded-lg border border-slate-700 px-3 py-2.5 text-sm hover:bg-slate-800">
          Close
        </button>
      </div>
    </div>

    <!-- Create modal -->
    <div id="createModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm items-center justify-center p-4">
      <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-2xl">
        <div class="text-lg font-bold mb-4">Create Tournament</div>
        <form id="createForm" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Name</label>
            <input name="name" type="text" maxlength="60" required value="Ludo Tournament"
              class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Entry Fee (PlayCoins)</label>
            <input name="entry_fee" type="number" min="10" max="5000" step="10" required value="100"
              class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Size</label>
            <select name="max_players"
              class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500">
              <option value="4">4 players</option>
              <option value="8" selected>8 players</option>
              <option value="16">16 players</option>
            </select>
          </div>
          <div class="flex gap-2">
            <button type="submit" class="flex-1 rounded-lg bg-brand-600 hover:bg-brand-700 px-4 py-2.5 text-sm font-bold">Create & Join</button>
            <button type="button" id="createCancel" class="rounded-lg border border-slate-700 hover:bg-slate-800 px-4 py-2.5 text-sm font-bold">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="/static/js/tournaments.js"></script>
</body>
</html>
